allowBuilds:
  unrs-resolver: true

# Force patched versions of transitive dependencies that upstream packages pin
# to vulnerable releases (next pins postcss 8.4.31; remark-mdx-frontmatter uses toml 3).
overrides:
  postcss: ^8.5.28
  "@babel/core": ^7.29.1
  browserslist: ^4.28.7
  baseline-browser-mapping: ^2.11.0
  toml: ^4.3.0
